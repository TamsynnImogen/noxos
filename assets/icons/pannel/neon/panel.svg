<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="96" viewBox="0 0 1200 96" xmlns="http://www.w3.org/2000/svg">
  <title>NOXpanel Resizable Panel Background</title>

  <defs>
    <!-- Main panel gradient -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="96">
      <stop offset="0" stop-color="#161A24"/>
      <stop offset="0.45" stop-color="#0F1219"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>

    <!-- Neon edge gradient -->
    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Glass shine -->
    <linearGradient id="glassHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid texture -->
    <pattern id="microGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none"
            stroke="#FFFFFF"
            stroke-opacity="0.018"
            stroke-width="1"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="panelShadow" x="-10%" y="-50%" width="120%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#000000"
                    flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Main scalable body -->
  <rect x="8" y="8" width="1184" height="80" rx="22"
        fill="url(#panelGradient)"
        stroke="#252B38"
        stroke-width="1.2"
        filter="url(#panelShadow)"/>

  <!-- Glass overlay -->
  <rect x="12" y="12" width="1176" height="72" rx="18"
        fill="url(#glassHighlight)"
        opacity="0.85"/>

  <!-- Subtle grid texture -->
  <rect x="12" y="12" width="1176" height="72" rx="18"
        fill="url(#microGrid)"
        opacity="0.65"/>

  <!-- Top neon accent -->
  <rect x="48" y="10" width="1104" height="2.4" rx="1.2"
        fill="url(#edgeGlow)"
        opacity="0.9"
        filter="url(#softGlow)"/>

  <!-- Bottom subtle accent -->
  <rect x="140" y="83.5" width="920" height="1.4" rx="0.7"
        fill="#8B5CF6"
        opacity="0.22"/>

  <!-- Left edge detail -->
  <g opacity="0.7">
    <path d="M24 24H48"
          stroke="#06B6D4"
          stroke-width="1.5"
          stroke-linecap="round"/>

    <path d="M24 30H40"
          stroke="#8B5CF6"
          stroke-width="1.1"
          stroke-linecap="round"/>
  </g>

  <!-- Right edge detail -->
  <g opacity="0.7">
    <path d="M1176 24H1152"
          stroke="#D946EF"
          stroke-width="1.5"
          stroke-linecap="round"/>

    <path d="M1176 30H1160"
          stroke="#8B5CF6"
          stroke-width="1.1"
          stroke-linecap="round"/>
  </g>

  <!-- Corner accents -->
  <path d="M24 18V14H40"
        fill="none"
        stroke="#06B6D4"
        stroke-width="1.4"
        stroke-linecap="round"
        opacity="0.85"/>

  <path d="M1176 78V82H1160"
        fill="none"
        stroke="#D946EF"
        stroke-width="1.4"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Optional center indicator -->
  <g opacity="0.3">
    <circle cx="600" cy="48" r="2.4" fill="#8B5CF6"/>
    <circle cx="600" cy="48" r="8" fill="none"
            stroke="#8B5CF6"
            stroke-width="0.7"/>
  </g>
</svg>
