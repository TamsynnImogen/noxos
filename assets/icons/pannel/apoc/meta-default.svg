<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NOXpanel APOC05 Meta Menu Icon - Default</title>
  <desc id="desc">Default state tactical hex-ring APOC meta menu icon for NOXpanel.</desc>

  <defs>
    <linearGradient id="apoc-gold" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6914"/>
      <stop offset="0.4" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#F5D36A"/>
    </linearGradient>

    <linearGradient id="apoc-inner" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A1F08"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>

    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="gold-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.83
                0 0 0 0 0.69
                0 0 0 0 0.22
                0 0 0 0.55 0" result="gold"/>
      <feMerge>
        <feMergeNode in="gold"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- tactical tile -->
  <rect x="7" y="7" width="50" height="50" rx="9"
        fill="#090909"
        stroke="#2A2111"
        stroke-width="1.4"
        filter="url(#soft-shadow)"/>

  <!-- inner matte panel -->
  <rect x="10" y="10" width="44" height="44" rx="7"
        fill="url(#apoc-inner)"
        opacity="0.95"/>

  <!-- subtle corner trims -->
  <path d="M15 17V14H22"
        fill="none"
        stroke="#D4AF37"
        stroke-width="1.2"
        stroke-linecap="round"
        opacity="0.8"/>

  <path d="M49 47V50H42"
        fill="none"
        stroke="#D4AF37"
        stroke-width="1.2"
        stroke-linecap="round"
        opacity="0.8"/>

  <!-- outer hex ring -->
  <polygon points="32,16 44,23 44,41 32,48 20,41 20,23"
           fill="none"
           stroke="url(#apoc-gold)"
           stroke-width="3"
           filter="url(#gold-glow)"/>

  <!-- segmented tactical ring -->
  <path d="M32 21L39 25V33L32 37L25 33V25Z"
        fill="none"
        stroke="#F5D36A"
        stroke-width="1.4"
        opacity="0.85"/>

  <!-- center core -->
  <circle cx="32" cy="29" r="3"
          fill="#D4AF37"
          opacity="0.9"/>

  <!-- lower core support -->
  <path d="M29 38H35"
        stroke="#B8860B"
        stroke-width="1.6"
        stroke-linecap="round"/>

  <!-- inner detail lines -->
  <path d="M24 25L28 27"
        stroke="#F5D36A"
        stroke-width="0.9"
        opacity="0.55"/>

  <path d="M40 25L36 27"
        stroke="#F5D36A"
        stroke-width="0.9"
        opacity="0.55"/>

  <!-- subtle state marker -->
  <circle cx="48" cy="16" r="1.2"
          fill="#D4AF37"
          opacity="0.65"/>
</svg>
