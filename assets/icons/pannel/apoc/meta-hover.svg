<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NOXpanel APOC05 Meta Menu Icon - Hover</title>
  <desc id="desc">Hover state tactical hex-ring APOC meta menu icon for NOXpanel.</desc>

  <defs>
    <linearGradient id="apoc-gold-hot" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.42" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>

    <radialGradient id="apoc-hover-core" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.26"/>
      <stop offset="0.48" stop-color="#8B6914" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.04"/>
    </radialGradient>

    <linearGradient id="apoc-panel" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#100D08"/>
      <stop offset="0.55" stop-color="#090909"/>
      <stop offset="1" stop-color="#1C1608"/>
    </linearGradient>

    <filter id="apoc-hover-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.44"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="apoc-hot-glow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.95
                0 0 0 0 0.76
                0 0 0 0 0.25
                0 0 0 0.78 0" result="gold"/>
      <feMerge>
        <feMergeNode in="gold"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- hover tactical tile -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="9.5"
        fill="url(#apoc-panel)"
        stroke="url(#apoc-gold-hot)"
        stroke-width="1.6"
        filter="url(#apoc-hover-shadow)"/>

  <!-- warm hover bloom -->
  <rect x="9.5" y="9.5" width="45" height="45" rx="7.5"
        fill="url(#apoc-hover-core)"
        opacity="1"/>

  <!-- corner trims -->
  <path d="M14.5 17.5V13.5H23"
        fill="none"
        stroke="#FFE08A"
        stroke-width="1.45"
        stroke-linecap="round"/>

  <path d="M49.5 46.5V50.5H41"
        fill="none"
        stroke="#FFE08A"
        stroke-width="1.45"
        stroke-linecap="round"/>

  <!-- outer hex ring glow -->
  <polygon points="32,15.5 44.5,23 44.5,41 32,48.5 19.5,41 19.5,23"
           fill="none"
           stroke="url(#apoc-gold-hot)"
           stroke-width="4.4"
           opacity="0.36"
           filter="url(#apoc-hot-glow)"/>

  <!-- outer hex ring main -->
  <polygon points="32,16 44,23 44,41 32,48 20,41 20,23"
           fill="none"
           stroke="url(#apoc-gold-hot)"
           stroke-width="3.25"/>

  <!-- segmented tactical ring -->
  <path d="M32 20.5L39.5 25V33.5L32 38L24.5 33.5V25Z"
        fill="none"
        stroke="#FFE08A"
        stroke-width="1.65"
        opacity="0.95"/>

  <!-- center core -->
  <circle cx="32" cy="29" r="3.3"
          fill="#FFE08A"
          opacity="0.96"/>

  <circle cx="32" cy="29" r="6.2"
          fill="none"
          stroke="#D4AF37"
          stroke-width="0.65"
          opacity="0.32"/>

  <!-- lower core support -->
  <path d="M28.5 38.4H35.5"
        stroke="#FFE08A"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- tactical interior detail -->
  <path d="M23.7 25L28 27.4"
        stroke="#FFE08A"
        stroke-width="1"
        opacity="0.72"/>

  <path d="M40.3 25L36 27.4"
        stroke="#FFE08A"
        stroke-width="1"
        opacity="0.72"/>

  <path d="M25.2 34.2L29.4 32.1"
        stroke="#D4AF37"
        stroke-width="0.9"
        opacity="0.65"/>

  <path d="M38.8 34.2L34.6 32.1"
        stroke="#D4AF37"
        stroke-width="0.9"
        opacity="0.65"/>

  <!-- subtle scan cut -->
  <path d="M16 32H48"
        stroke="#D4AF37"
        stroke-width="0.55"
        opacity="0.18"/>

  <!-- hover state marker -->
  <circle cx="48" cy="16" r="1.65"
          fill="#FFE08A"/>
</svg>
